  .dtab.on3 { color:var(--d3); border-color:var(--d3); }

  .ctab { flex:1; text-align:center; padding:10px 0 9px; font-size:13.5px; font-weight:700; color:var(--sub);
          border-bottom:3px solid transparent; cursor:pointer; }

  .daydesc { font-size:12px; color:var(--sub); padding:9px 16px 0; line-height:1.55; }
  #map { height:300px; margin:10px 12px; border-radius:12px; border:1px solid var(--line); }
  #list { margin:0 12px 10px; background:#fff; border-radius:12px; border:1px solid var(--line); overflow:hidden; }
  .stop { display:flex; align-items:center; gap:10px; padding:11px 12px; border-bottom:1px solid var(--line); }
  .stop:last-child { border-bottom:none; }
  .stop.done .nm { text-decoration:line-through; color:#a5b1bd; }
  .stop.sel { background:#f2f7ff; box-shadow:inset 3px 0 0 var(--accent); }
  .info { cursor:pointer; }
  .chk { width:24px; height:24px; border-radius:50%; border:2px solid #cfd8e0; flex:none; display:flex;
         align-items:center; justify-content:center; font-size:13px; color:#fff; cursor:pointer; }
  .stop.done .chk { border-color:transparent; background:var(--accent); }
  .num { width:22px; height:22px; border-radius:50%; color:#fff; font-size:12px; font-weight:800; flex:none;
         display:flex; align-items:center; justify-content:center; background:var(--accent); }
  .num.opt { background:#a5b1bd; }
  .num.ico { background:#fff; color:var(--ink); border:1.5px solid #cfd8e0; border-radius:8px; font-size:12px; }
  .info { flex:1; min-width:0; }
  .nm { font-size:14.5px; font-weight:700; }
  .star { color:#d5dbe1; cursor:pointer; margin-right:4px; font-size:16px; vertical-align:-1px; }
  .star.on { color:#f5b301; text-shadow:0 0 4px rgba(245,179,1,.45); }
  .memo { font-size:11.5px; color:var(--sub); margin-top:1px; line-height:1.4; }
  .tagx { font-size:9px; font-weight:700; color:#fff; border-radius:4px; padding:1.5px 5px; margin-left:4px; vertical-align:1.5px; }
  .t-night { background:#4a3f8f; } .t-sunset { background:#d97b28; } .t-boat { background:#3a7ca5; } .t-check { background:#9a4747; }
  .btns { display:flex; gap:6px; flex:none; }
  .btns a { display:flex; align-items:center; justify-content:center; width:40px; height:38px; border-radius:10px;
            font-size:10px; font-weight:700; text-decoration:none; }
  .b-map { background:#FEE500; color:#3c1e1e; }
  .b-nvr { background:#03C75A; color:#fff; }
  .b-nav { background:#2c3a4a; color:#fff; }
  .b-note { background:#eef1f5; color:#5a6b7c; width:34px; }
  .b-note.has { background:#fdf0c8; color:#8a6d1a; }
  .unote { font-size:11.5px; color:#8a6d1a; background:#fdf6e3; border-radius:6px; padding:3px 8px; margin-top:4px; display:inline-block; white-space:pre-wrap; }

  .sup a { color:var(--ink); font-weight:600; }
  footer { text-align:center; font-size:10.5px; color:#a5b1bd; padding:4px 0 14px; }

      ['외도 보타니아','8021411',34.7694730,128.7113947,'선택 — 배 타고 가는 해상정원','boat',true,'외도보타니아'],
      ['거제식물원 정글돔','1330723003',34.8568140,128.5780918,'선택 — 실내 유리온실',null,true,'거제식물원'],
    ],
    food:[
      ['예가','16495009',34.8136067,128.7052214,'물회·멍게비빔밥 평점 최상위',null,false,'거제 예가'],
      ['거제보재기집','21724273',34.8307291,128.7120188,'성게비빔밥·물회',null,false,'거제보재기집'],
      ['백만석 본점','24124834',34.8753286,128.6268714,'간장게장·멍게비빔밥',null,false,'거제 백만석'],
      ['거제도찜전문','1559200721',34.8305713,128.7029698,'대구뽈찜',null,false,'거제도찜전문'],
    ],
    cafe:[
      ['온더선셋','482253011',34.9161699,128.5197521,'동남아 감성·일몰 — 거제 들어가는 길목',null,false,'거제 온더선셋'],
      ['시방리카페 매미성점','496718042',34.9636158,128.7067828,'붕어페스츄리 — 매미성 도보 1분',null,false,'시방리카페 매미성점'],
      ['심해','666082526',34.9665739,128.7058720,'루프탑 베이커리 — 매미성 도보 8분',null,false,'거제 카페 심해'],
      ['오송웨이브','1143144142',34.8159445,128.5854121,'정원 피크닉 대형카페',null,false,'거제 오송웨이브'],
    ],
    etc:[
      ['한려해상국립공원 학동주차장','749303601',34.7755380,128.6414210,'몽돌해변 앞','park',false,'학동 주차장'],
      ['매미성 주차장','1653556241',34.9660677,128.7041842,'장목면 시방리 832-3 (맹종죽은 자체 주차장)','park',false,'매미성 주차장'],
      ['장목면사무소 전기차충전소','900514935',34.9865922,128.6823836,'매미성 근처 공공 충전','charge',false,'장목면사무소 전기차충전소'],
      ['거제휴게소 전기차충전소','628667848',34.9733387,128.6928689,'귀갓길 충전 겸 휴식','charge',false,'거제휴게소 전기차충전소'],
    ],
  },
};
const TAG = { night:['야간','t-night'], sunset:['일몰','t-sunset'], boat:['배편','t-boat'], check:['확인필요','t-check'] };
const CATICON = { food:'🍴', cafe:'☕' };
const ETCICON = { park:'🅿️', charge:'⚡', };
const HOME = [34.8555, 128.4225];
const KEY = 'ty-course-check-v2';
let checks = JSON.parse(localStorage.getItem(KEY) || '{}');
const FKEY = 'ty-favs';
let favs = JSON.parse(localStorage.getItem(FKEY) || '{}');
function favKey(s){ return s[1] || s[0]; }
function favToggle(k){
  favs[k] = !favs[k];
  if (!favs[k]) delete favs[k];
  localStorage.setItem(FKEY, JSON.stringify(favs));
  render();
}
const NKEY = 'ty-notes';
const DEFAULT_NOTES = {
  '1956555086': '연주: 저녁으로 딱이다',
  '115499738': '연주: 몽가.. 비릴 것 같은 것만 있어서 덜 땡김',
  '18329404': '연주: 한 끼보단 맛보기로 하나 사서 나눠먹기. 충무김밥이랑 같이 포장해서 먹으면 좋을듯!',
  '179984071': '연주: 수국 이뿌다',
  '1267451521': '연주: 디저트 포장만 해가도 될듯',
  '8608591': '연주: 원조 충무김밥 자셔봐야지!! 디저트랑 같이 포장해서 바다 가서 먹어도 될듯',
  '10696544': '연주: 한번도 안 먹어본 메뉴!! 둘째날이나 셋째날 아침으로 먹을까',
};
let notes = Object.assign({}, DEFAULT_NOTES, JSON.parse(localStorage.getItem(NKEY) || '{}'));
function goNavi(lat, lng, name){
  // 정식 SDK 경로 (JS키 + 도메인 등록 완료)
  try {
    if (window.Kakao && Kakao.Navi) {
      if (!Kakao.isInitialized()) Kakao.init('b211617b5b05256d1850fde3cbc6cf29');
      Kakao.Navi.start({ name: name, x: Number(lng), y: Number(lat), coordType: 'wgs84' });
      return;
    }
  } catch(e) {}
  // SDK 미로드 시 공식 런처로
  const param = {
    destination: { name: name, x: Number(lng), y: Number(lat) },
    option: { coord_type: 'wgs84', vehicle_type: 1, rpoption: 100, route_info: false }
  };
  location.href = 'https://kakaonavi.kakao.com/launch/index.do?appkey=b211617b5b05256d1850fde3cbc6cf29&apiver=1.0&param='
    + encodeURIComponent(JSON.stringify(param));
}
let selKey = null;
function selPlace(k, lat, lng){
  selKey = (selKey === k) ? null : k;
  render();
  if (selKey) map.panTo([lat, lng]);
}
function noteEdit(k, name){
  const v = prompt(name + ' 메모', notes[k] || '');
  if (v === null) return;
  notes[k] = v.trim();
  localStorage.setItem(NKEY, JSON.stringify(notes));
  render();
}
let curDay = 1, curCat = 'spot';

const map = L.map('map', {zoomControl:false, attributionControl:false});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
const layer = L.layerGroup().addTo(map);

function toggle(id, el){
  checks[id] = !checks[id];
  localStorage.setItem(KEY, JSON.stringify(checks));
  el.parentElement.classList.toggle('done', checks[id]);
}

function render(){
  const cfg = DATA[curDay];
  const stops = cfg[curCat];
  document.documentElement.style.setProperty('--accent', cfg.color);
  document.body.style.setProperty('--accent', cfg.color);

  [1,2,3].forEach(i=>{ document.getElementById('dtab'+i).className = 'dtab' + (i===curDay ? ' on'+i : ''); });
  ['spot','food','cafe','etc'].forEach(c=>{
    document.getElementById('ctab-'+c).className = 'ctab' + (c===curCat ? ' on on'+curDay : '');
  });
  document.getElementById('daydesc').textContent = cfg.desc;

  // 리스트
  const list = document.getElementById('list');
  list.innerHTML = '';
  let n = 0;
  stops.forEach((s,i)=>{
    const id = curDay+'-'+curCat+'-'+s[1];
    const row = document.createElement('div');
    row.className = 'stop' + (checks[id] ? ' done' : '') + (favKey(s)===selKey ? ' sel' : '');
    row.style.setProperty('--accent', cfg.color);
    const tag = (s[5] && TAG[s[5]]) ? `<span class="tagx ${TAG[s[5]][1]}">${TAG[s[5]][0]}</span>` : '';
    let badgeHtml;
    if (curCat==='spot') badgeHtml = `<div class="num${s[6]?' opt':''}">${s[6]?'＋':++n}</div>`;
    else if (curCat==='etc') badgeHtml = `<div class="num ico">${s[1]===null?'🏠':ETCICON[s[5]]||'🅿️'}</div>`;
    else badgeHtml = `<div class="num ico">${CATICON[curCat]}</div>`;
    row.innerHTML = `
      <div class="chk" onclick="toggle('${id}',this)">✓</div>
      ${badgeHtml}
      <div class="info" onclick="selPlace('${favKey(s)}', ${s[2]}, ${s[3]})"><div class="nm"><span class="star${favs[favKey(s)]?' on':''}" onclick="favToggle('${favKey(s)}')">★</span>${s[0]}${tag}</div><div class="memo">${s[4]}</div>${notes[favKey(s)] ? `<div class="unote">📝 ${notes[favKey(s)]}</div>` : ''}</div>
      <div class="btns">
        ${s[1] ? `<a class="b-map" href="https://place.map.kakao.com/${s[1]}">카카오</a>` : ''}
        <a class="b-nvr" href="https://map.naver.com/p/search/${encodeURIComponent(s[7])}">네이버</a>
        <a class="b-nav" href="javascript:void(0)" onclick="goNavi(${s[2]}, ${s[3]}, '${s[0]}')">내비</a>
        <a class="b-note${notes[favKey(s)] ? ' has' : ''}" href="javascript:void(0)" onclick="noteEdit('${favKey(s)}', '${s[0].replace(/'/g,'')}')">📝</a>
      </div>`;
    list.appendChild(row);
  });

  // 지도 — 모든 카테고리 표시, 선택 카테고리만 강조
  layer.clearLayers();
  if (curDay===1 || curDay===2) {
    L.marker(HOME, {icon: L.divIcon({
      html:'<div style="width:26px;height:26px;border-radius:8px;background:#1a2b3c;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)">🏠</div>',
      className:'', iconSize:[26,26], iconAnchor:[13,13]})}).addTo(layer);
  }
  // 여행지 번호 미리 계산
  let sn = 0;
  cfg.spot.forEach(s=>{ s._n = s[6] ? '＋' : ++sn; });

  function drawMarker(s, cat, active){
    let label, bg, txtc='#fff', radius='50%';
    if (cat==='etc') { label=(s[1]===null?'🏠':ETCICON[s[5]]||'🅿️'); bg='#fff'; txtc='#1a2b3c'; radius='8px'; }
    else if (cat==='food') { label='🍴'; bg='#fff'; txtc='#1a2b3c'; radius='8px'; }
    else if (cat==='cafe') { label='☕'; bg='#fff'; txtc='#1a2b3c'; radius='8px'; }
    else if (s[6]) { label='＋'; bg='#a5b1bd'; }
    else { label=s._n; bg=cfg.color; }
    const fav = !!favs[favKey(s)];
    const size = fav ? (active ? 31 : 26) : (active ? 29 : 22);
    const fs = active ? 13 : 11;
    let bd = active ? '3.5px solid #fff' : '1.5px solid rgba(120,135,150,.5)';
    let op = active ? 1 : 0.85;
    let sh = active ? '0 0 0 2px rgba(0,0,0,.15), 0 3px 8px rgba(0,0,0,.5)' : '0 1px 3px rgba(0,0,0,.3)';
    if (fav) { bd = (active?'3.5px':'3px') + ' solid #f5b301'; sh = '0 0 0 3px rgba(245,179,1,.35), 0 2px 6px rgba(0,0,0,.4)'; op = 1; }
    L.marker([s[2],s[3]], {icon: L.divIcon({
      html:`<div style="width:${size}px;height:${size}px;border-radius:${radius};background:${bg};color:${txtc};font-weight:800;font-size:${fs}px;display:flex;align-items:center;justify-content:center;border:${bd};box-shadow:${sh};opacity:${op}">${label}</div>`,
      className:'', iconSize:[size,size], iconAnchor:[size/2,size/2]})}).addTo(layer)
      .on('click',()=>{ if(s[1]) location.href='https://place.map.kakao.com/'+s[1]; });
  }

  // 루트 선 (여행지 탭이면 진하게, 아니면 흐리게)
  const rpts = cfg.spot.filter(s=>!s[6]).map(s=>[s[2],s[3]]);
  L.polyline(rpts, {color:cfg.color, weight:3, opacity:(curCat==='spot'?0.85:0.25), dashArray:'6 6'}).addTo(layer);

  function drawSelected(s, cat){
    let label, bg, txtc='#fff';
    if (cat==='etc') { label=(s[1]===null?'🏠':ETCICON[s[5]]||'🅿️'); bg='#fff'; txtc='#1a2b3c'; }
    else if (cat==='food') { label='🍴'; bg='#fff'; txtc='#1a2b3c'; }
    else if (cat==='cafe') { label='☕'; bg='#fff'; txtc='#1a2b3c'; }
    else if (s[6]) { label='＋'; bg='#a5b1bd'; }
    else { label=s._n!==undefined?s._n:'•'; bg=cfg.color; }
    const html = `<div style="display:flex;flex-direction:column;align-items:center;width:150px;">
      <div style="max-width:146px;background:${cfg.color};color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px rgba(0,0,0,.35);margin-bottom:3px;">📌 ${s[0]}</div>
      <div style="width:30px;height:30px;border-radius:${(cat==='spot')?'50%':'9px'};background:${bg};color:${txtc};font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;border:3.5px solid #fff;box-shadow:0 0 0 3px ${cfg.color}66, 0 3px 8px rgba(0,0,0,.5);">${label}</div>
    </div>`;
    L.marker([s[2],s[3]], {icon: L.divIcon({html, className:'', iconSize:[150,58], iconAnchor:[75,43]}), zIndexOffset:1000}).addTo(layer)
      .on('click',()=>{ if(s[1]) location.href='https://place.map.kakao.com/'+s[1]; });
  }

  // 비선택 카테고리 먼저(아래), 선택 카테고리 나중(위), 탭 선택 장소는 이름표와 함께 최상단
  let selStop = null, selCat = null;
  ['spot','food','cafe','etc'].forEach(c=>{ (cfg[c]||[]).forEach(x=>{ if(favKey(x)===selKey){ selStop=x; selCat=c; } }); });
  ['spot','food','cafe','etc'].filter(c=>c!==curCat).forEach(c=>{ (cfg[c]||[]).forEach(s=>{ if(favKey(s)!==selKey) drawMarker(s,c,false); }); });
  (cfg[curCat]||[]).forEach(s=>{ if(favKey(s)!==selKey) drawMarker(s,curCat,true); });
  if (selStop) drawSelected(selStop, selCat);

  let boundPts = [];
  ['spot','food','cafe','etc'].forEach(c=>{
    (cfg[c]||[]).forEach(x=>{ if(!x[6] && x[5]!=='boat' && x[5]!=='far') boundPts.push([x[2],x[3]]); });
  });
  if (curDay===1 || curDay===2) boundPts.push(HOME);
  map.invalidateSize();
  if (window._lastDay !== curDay) {
    map.fitBounds(L.latLngBounds(boundPts).pad(0.12));
    window._lastDay = curDay;
  }
}

function setDay(d){ curDay = d; render(); }
function setCat(c){ curCat = c; render(); }

const today = new Date();
curDay = (today.getMonth()===6 && today.getDate()===31) ? 1
       : (today.getMonth()===7 && today.getDate()===1) ? 2
       : (today.getMonth()===7 && today.getDate()===2) ? 3 : 1;
render();
setTimeout(()=>{ map.invalidateSize(); render(); }, 200);
</script>
</body>
</html>
